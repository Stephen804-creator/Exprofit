# Exprofit: one public web URL for the frontend and API; PostgreSQL stays private.
services:
  - type: web
    name: exprofit
    runtime: python
    plan: free
    region: singapore
    buildCommand: cd frontend && npm install && VITE_API_BASE_URL="" npm run build && cd ../backend && pip install .
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: exprofit-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      # Set these four SMTP values in the Render Dashboard; never commit credentials.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "true"

databases:
  - name: exprofit-db
    databaseName: exprofit
    user: exprofit
    plan: free
    region: singapore
    postgresMajorVersion: "16"
